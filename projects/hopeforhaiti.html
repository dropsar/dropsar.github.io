<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hope For Haiti | Drops</title>
  <meta content="AR (augmented reality) scavenger hunt project using 8thwall webAR platform. Drops created this scavenger hunt experience as part of the Niantic 8thwall challenge." name="description">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link href="../images/favicon.ico" rel="shortcut icon" type="image/x-icon">
  <link href="../images/webclip.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Montserrat:wght@300;400;500&family=DM+Serif+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#9990FF',
            'accent-light': '#b8b2ff',
            dark: '#1a1a1a',
            muted: '#6b7280',
          },
          fontFamily: {
            heading: ['DM Sans', 'sans-serif'],
            body: ['Montserrat', 'sans-serif'],
            accent: ['DM Serif Display', 'serif'],
          },
        }
      }
    }
  </script>

  <!-- Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
  <script src="../js/components/header.js" type="text/javascript" defer></script>

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #fafaf9;
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <header-component></header-component>

  <!-- Project Hero Section -->
  <section class="pt-32 lg:pt-40 pb-24 lg:pb-32">
    <div class="max-w-7xl mx-auto px-6 lg:px-12">
      <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-center">

        <!-- Left: Model Viewer -->
        <div class="relative">
          <div class="relative rounded-2xl overflow-hidden bg-neutral-100 aspect-square">
            <a href="https://give.hopeforhaiti.com/give/516314" target="_blank" class="block w-full h-full">
              <model-viewer
                src="../images/hope4haitiDonate.glb"
                camera-orbit="45deg 55deg -70deg"
                camera-target="0m 0m 0m"
                min-field-of-view="-3000"
                max-field-of-view="3000"
                interaction-prompt="none"
                shadow-intensity="1"
                touch-action="pan-y"
                auto-rotate
                rotation-per-second="30deg"
                class="w-full h-full"
                style="--poster-color: transparent;">
              </model-viewer>
            </a>
          </div>
        </div>

        <!-- Right: Content -->
        <div>
          <p class="text-xs text-accent font-heading tracking-wide uppercase mb-4">Hope For Haiti</p>
          <h1 class="font-heading text-4xl sm:text-5xl lg:text-6xl font-light tracking-tight text-dark mb-6">
            Hope For Haiti
          </h1>

          <a href="hopeforhaiti/map.html" class="inline-block bg-accent text-white font-heading text-sm tracking-wide px-8 py-3.5 rounded-full hover:bg-accent-light transition-colors mb-6">
            CLICK HERE TO BEGIN
          </a>

          <p class="text-muted font-light leading-relaxed mb-4">
            or choose your own adventure:
          </p>

          <ol class="text-muted font-light leading-relaxed mb-8 space-y-3 list-decimal list-inside">
            <li>
              <a href="hopeforhaiti/map.html" class="text-accent hover:text-accent-light underline transition-colors">See Haiti on a Map</a>
            </li>
            <li>
              <a href="https://www.drops.nyc/d/654404c731e1f9a2a0a8e1b9" target="_blank" class="text-accent hover:text-accent-light underline transition-colors">Before & After 2021 Earthquake</a>
            </li>
            <li>
              <a href="https://www.drops.nyc/d/65444e7031e1f9a2a0a8e322" target="_blank" class="text-accent hover:text-accent-light underline transition-colors">Hope For Haiti on the Ground</a>
            </li>
            <li>
              <a href="https://www.drops.nyc/hopeforhaiti/ARHunt" target="_blank" class="text-accent hover:text-accent-light underline transition-colors">Scavenger Hunt Experience!</a>
            </li>
          </ol>

          <div class="mt-8">
            <h2 class="font-heading text-2xl font-medium text-dark mb-4">Donate</h2>
            <a href="https://give.hopeforhaiti.com/give/516314" target="_blank" class="inline-block bg-dark text-white font-heading text-sm tracking-wide px-8 py-3.5 rounded-full hover:bg-neutral-700 transition-colors">
              DONATE NOW
            </a>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Back to Home -->
  <section class="py-16 bg-white">
    <div class="max-w-7xl mx-auto px-6 lg:px-12 text-center">
      <a href="/#more-work" class="inline-block border border-neutral-300 text-dark font-heading text-sm tracking-wide px-8 py-3.5 rounded-full hover:border-accent hover:text-accent transition-colors">
        ← Back to All Work
      </a>
    </div>
  </section>
</body>
</html>
