<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trivium | Drops</title>
  <meta content="AR (augmented reality) Scavenger Hunt project using 8thwall webAR platform. Drops created this scavenger hunt experience in conjunction with Elektra Records and Trivium" name="description">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link href="../images/favicon.ico" rel="shortcut icon" type="image/x-icon">
  <link href="../images/webclip.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Montserrat:wght@300;400;500&family=DM+Serif+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#9990FF',
            'accent-light': '#b8b2ff',
            dark: '#1a1a1a',
            muted: '#6b7280',
          },
          fontFamily: {
            heading: ['DM Sans', 'sans-serif'],
            body: ['Montserrat', 'sans-serif'],
            accent: ['DM Serif Display', 'serif'],
          },
        }
      }
    }
  </script>

  <script src="../js/components/header.js" type="text/javascript" defer></script>

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #fafaf9;
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <header-component></header-component>

  <!-- Project Hero Section -->
  <section class="pt-32 lg:pt-40 pb-24 lg:pb-32">
    <div class="max-w-7xl mx-auto px-6 lg:px-12">
      <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-center">

        <!-- Left: Image Carousel -->
        <div class="relative">
          <div id="carousel" class="relative rounded-2xl overflow-hidden bg-neutral-100 aspect-square">
            <!-- Slide 1 -->
            <div class="carousel-slide absolute inset-0 flex items-center justify-center">
              <img src="../images/page_trivium_image1-500.png" loading="lazy" sizes="(max-width: 479px) 94vw, (max-width: 767px) 95vw, (max-width: 991px) 92vw, 43vw" srcset="../images/page_trivium_image1-500.png 500w, ../images/page_trivium_image1-800.png 800w, ../images/page_trivium_image1-1080.png 1080w, ../images/page_trivium_image1.png 1144w" alt="" class="w-full h-full object-cover">
            </div>

            <!-- Slide 2 -->
            <div class="carousel-slide absolute inset-0 hidden flex items-center justify-center">
              <img src="../images/page_trivium_image-500.png" loading="lazy" sizes="(max-width: 479px) 94vw, (max-width: 767px) 95vw, (max-width: 991px) 92vw, 43vw" srcset="../images/page_trivium_image-500.png 500w, ../images/page_trivium_image-800.png 800w, ../images/page_trivium_image-1080.png 1080w, ../images/page_trivium_image.png 1144w" alt="" class="w-full h-full object-cover">
            </div>
          </div>

          <!-- Navigation Arrows -->
          <button onclick="prevSlide()" class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white text-dark rounded-full p-3 shadow-lg transition-all z-10">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <button onclick="nextSlide()" class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white text-dark rounded-full p-3 shadow-lg transition-all z-10">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>

          <!-- Dots -->
          <div class="flex justify-center gap-2 mt-6">
            <button onclick="goToSlide(0)" class="carousel-dot w-2 h-2 rounded-full bg-accent transition-all"></button>
            <button onclick="goToSlide(1)" class="carousel-dot w-2 h-2 rounded-full bg-neutral-300 transition-all"></button>
          </div>
        </div>

        <!-- Right: Content -->
        <div>
          <p class="text-xs text-accent font-heading tracking-wide uppercase mb-4">Elektra Records</p>
          <h1 class="font-heading text-4xl sm:text-5xl lg:text-6xl font-light tracking-tight text-dark mb-6">
            Trivium
          </h1>
          <p class="text-muted font-light leading-relaxed mb-8">
            Over the course of 8 days and 40 cities, Trivium created a worldwide scavenger hunt featuring an AR Golden Dragon and pre-release songs.
          </p>
          <a href="https://www.drops.nyc/v2/d/6154a0863409830004eba844" target="_blank" class="inline-block bg-dark text-white font-heading text-sm tracking-wide px-8 py-3.5 rounded-full hover:bg-neutral-700 transition-colors">
            FULL EXPERIENCE IN AR
          </a>
        </div>

      </div>
    </div>
  </section>

  <!-- Back to Home -->
  <section class="py-16 bg-white">
    <div class="max-w-7xl mx-auto px-6 lg:px-12 text-center">
      <a href="/#more-work" class="inline-block border border-neutral-300 text-dark font-heading text-sm tracking-wide px-8 py-3.5 rounded-full hover:border-accent hover:text-accent transition-colors">
        ← Back to All Work
      </a>
    </div>
  </section>

  <script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.carousel-slide');
    const dots = document.querySelectorAll('.carousel-dot');

    function showSlide(index) {
      slides.forEach((slide, i) => {
        if (i === index) {
          slide.classList.remove('hidden');
          slide.classList.add('active');
        } else {
          slide.classList.add('hidden');
          slide.classList.remove('active');
        }
      });

      dots.forEach((dot, i) => {
        if (i === index) {
          dot.classList.remove('bg-neutral-300');
          dot.classList.add('bg-accent');
        } else {
          dot.classList.add('bg-neutral-300');
          dot.classList.remove('bg-accent');
        }
      });

      currentSlide = index;
    }

    function nextSlide() {
      const next = (currentSlide + 1) % slides.length;
      showSlide(next);
    }

    function prevSlide() {
      const prev = (currentSlide - 1 + slides.length) % slides.length;
      showSlide(prev);
    }

    function goToSlide(index) {
      showSlide(index);
    }
  </script>
</body>
</html>
